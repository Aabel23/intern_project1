# Drop-in bật debug trace cho flexmix-backend.service.
#
# Nó KHÔNG thay thế unit gốc, chỉ chồng thêm mấy biến môi trường lên, nên
# unit ở /etc/systemd/system/flexmix-backend.service giữ nguyên không đụng
# tới. Muốn tắt debug thì xoá drop-in này đi là xong.
#
# CÀI:
#   sudo mkdir -p /etc/systemd/system/flexmix-backend.service.d
#   sudo cp flexmix-backend-debug.conf \
#        /etc/systemd/system/flexmix-backend.service.d/debug.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart flexmix-backend
#
# XEM:
#   tail -f /home/flexxource/hungvu/version1.0/order/debug.log
#
# GỠ (tắt debug, máy chạy lại như cũ):
#   sudo rm -r /etc/systemd/system/flexmix-backend.service.d
#   sudo systemctl daemon-reload
#   sudo systemctl restart flexmix-backend

[Service]
# Không có dòng này thì print() của Python bị đệm lại khi output không phải
# terminal: các dòng [DBG] có flush nên ra ngay, còn print() cũ trong
# process_runner thì ra thành cụm về sau, đọc log thấy sai thứ tự.
Environment=PYTHONUNBUFFERED=1

# Công tắc debug. Đổi 1 thành 0 để tắt mà không phải sửa code.
Environment=FLEXMIX_DEBUG=1

# Ghi ra file riêng thay vì để dồn hết vào journal. Journald mặc định chỉ
# nhận 10000 dòng mỗi 30 giây rồi bắt đầu vứt bớt, và trace thì sinh ra
# rất nhiều dòng. File riêng còn dễ grep hơn.
# Cả process_runner (tiến trình con) cũng thừa hưởng biến này nên ghi chung
# vào đúng file đó.
Environment=FLEXMIX_DEBUG_FILE=/home/flexxource/hungvu/version1.0/order/debug.log
