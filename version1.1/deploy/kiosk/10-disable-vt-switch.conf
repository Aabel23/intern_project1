# Chặn Ctrl+Alt+F1..F7 chuyển sang console text và Ctrl+Alt+Backspace giết
# X, để người đứng trước màn hình không có cách nào thoát ra ngoài kiosk
# bằng bàn phím (nếu có gắn bàn phím ngoài vào).
#
# Cài đặt:
#   sudo cp 10-disable-vt-switch.conf /etc/X11/xorg.conf.d/
#   khởi động lại máy

Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
    Option "DontZoom" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection